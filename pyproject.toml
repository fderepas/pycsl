[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycsl"
version = "0.1.0"
description = "Python Contract Specification Language — compiles PyCSL annotations to WhyML for formal verification"
requires-python = ">=3.10"
dependencies = [
    "libcst",
    "lark",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
rag = [
    "numpy>=1.24",
]

[project.scripts]
pycsl = "pycsl.pycsl:main"
rocq2pycsl = "rocq2pycsl.cli:main"
lean2pycsl = "lean2pycsl.cli:main"
pycsl-bridge = "pycsl_bridge.cli:main"
skill2rag = "skill2rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycsl*", "pycsl_emit*", "pycsl_bridge*", "rocq2pycsl*", "lean2pycsl*", "skill2rag*"]
